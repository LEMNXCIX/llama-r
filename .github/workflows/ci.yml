name: CI

on:
  push:
    branches: [master]
  pull_request:

# A stale PR run should never mask the state of the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, audit, clippy, tests, coverage, deny, release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The repo links against OpenSSL and needs pkg-config headers for
      # openssl-sys on a fresh runner.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Formatting
        run: cargo fmt --check

      # Pinned: a floating cargo-audit moves the advisory DB format and the
      # lint set under us between runs. Bump deliberately, not by CI drift.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Security advisories
        run: cargo audit

      # All pre-existing lints were cleared when this gate was added: the
      # mechanical ones with cargo clippy --fix, the too_many_arguments ones
      # with documented allows on stable interfaces, and the 16
      # await_holding_lock ones with an allow on the test modules that hold an
      # env lock deliberately.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --target-dir target-tests

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # cargo-llvm-cov has no bare `--fail-under` and no `--target-dir`
      # (verified against `cargo llvm-cov --help` and its CHANGELOG: only
      # `--fail-under-lines|functions|regions|file-lines` ever existed). The
      # working equivalents are `--fail-under-lines 40` (floor on line
      # coverage, exit 1 below it) and the `CARGO_TARGET_DIR` env var, which
      # keeps coverage artifacts in `target-tests/` alongside the test build.
      - name: Coverage
        run: CARGO_TARGET_DIR=target-tests cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 40

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Dependency policy
        run: cargo deny check

      - name: Release build
        run: cargo build --release --target-dir target-release

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A stale PR run should never mask the state of the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, audit, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The repo links against OpenSSL and needs pkg-config headers for
      # openssl-sys on a fresh runner.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security advisories
        run: cargo audit

      # All pre-existing lints were cleared when this gate was added: the
      # mechanical ones with cargo clippy --fix, the too_many_arguments ones
      # with documented allows on stable interfaces, and the 16
      # await_holding_lock ones with an allow on the test modules that hold an
      # env lock deliberately.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --target-dir target-tests

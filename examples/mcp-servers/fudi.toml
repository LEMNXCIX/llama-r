# Example MCP server registration for an external app (Fudi).
# Place under mcp-servers/ at LLAMA_R_DIR when the registry loader is wired.

id = "fudi"
transport = "http"
url = "http://127.0.0.1:4100/mcp"
# Secret lives in the environment — never commit tokens here.
auth_env = "FUDI_MCP_TOKEN"
timeout_secs = 30
tool_namespace = "fudi"
enabled = true

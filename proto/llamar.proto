syntax = "proto3";

package llamar;

service LlamaGateway {
  rpc Chat (ChatRequest) returns (ChatResponse);
  rpc ChatStream (ChatRequest) returns (stream ChatStreamEvent);
  rpc ConnectMcp (stream McpMessage) returns (stream McpMessage); // For Model Context Protocol
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  bool stream = 3;
}

// Per-response token accounting, when the upstream reported any. `cost_usd`
// is optional because no fabricated price is ever sent: it stays unset unless
// the catalog knew both token prices.
message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  optional double cost_usd = 3;
}

message ChatResponse {
  string model = 1;
  string created_at = 2;
  ChatMessage message = 3;
  bool done = 4;
  // The conversation a persisted turn was stored under, so a client can echo
  // it back as x-conversation-id to continue the thread.
  optional string conversation_id = 5;
  // The secret-free profile name that actually answered, when a fallback was
  // used. Never a credential value.
  optional string served_by = 6;
  optional Usage usage = 7;
}

// Non-secret approval identifiers attached to one stream event. Raw tool
// arguments are deliberately absent: only the hash of the canonical args is
// carried so a client can bind its decision to what a human saw.
message ApprovalStreamInfo {
  string id = 1;
  string tool_name = 2;
  string args_hash = 3;
  optional string task_id = 4;
  optional uint32 depth = 5;
}

// Non-secret progress information for one tool call/result. A call carries the
// canonical args hash; a result carries only whether the tool failed. Raw
// arguments and output previews are deliberately absent.
message ToolStreamInfo {
  string kind = 1;
  string tool_name = 2;
  optional bool is_error = 3;
  optional string args_hash = 4;
}

message ChatStreamEvent {
  string model = 1;
  string created_at = 2;
  ChatMessage message = 3;
  bool done = 4;
  optional ApprovalStreamInfo approval = 5;
  optional ToolStreamInfo tool = 6;
}

// MCP Messages
message McpMessage {
  string json_rpc = 1;
  string method = 2;
  string params = 3; // JSON encoded string for flexibility
}
